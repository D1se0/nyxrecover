name: 🜲 Release NyxRecover

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir .deb
        run: |
          chmod +x packaging/build-deb.sh
          ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nyxrecover-deb
          path: dist/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build app + CLI + instalador
        shell: pwsh
        run: |
          python -m venv .venv-win
          .venv-win\Scripts\pip install -q --upgrade pip
          .venv-win\Scripts\pip install -q customtkinter pillow textual rich pyinstaller
          # App de escritorio (ventana)
          .venv-win\Scripts\pyinstaller --name NyxRecover --onefile --noconsole `
            --icon assets\nyx.ico `
            --add-data "nyx;nyx" --collect-all customtkinter --collect-all textual --collect-all rich `
            --distpath dist nyx/launcher.py
          # CLI (consola)
          .venv-win\Scripts\pyinstaller --name NyxRecover-cli --onefile --console `
            --icon assets\nyx.ico `
            --add-data "nyx;nyx" --collect-all customtkinter --collect-all textual --collect-all rich `
            --distpath dist nyx/launcher.py
          # smoke test del CLI (la app de ventana requiere sesión gráfica)
          & dist\NyxRecover-cli.exe --cli audit 2>&1 | Tee-Object -Variable smoke
          if ($LASTEXITCODE -ne 0) { throw "Smoke test del CLI fallo" }
          Compress-Archive -Path dist\NyxRecover.exe, dist\NyxRecover-cli.exe -DestinationPath dist\NyxRecover-${{ github.ref_name }}-windows-x64.zip -Force
          # instalador Inno Setup
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DAppVersion=$("${{ github.ref_name }}".TrimStart("v")) packaging\windows-installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: nyxrecover-windows
          path: |
            dist/NyxRecover-*-x64.zip
            dist/NyxRecover-*-x64-setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build .app de ventana + CLI (macOS)
        run: |
          python3 -m venv .venv-mac
          .venv-mac/bin/pip install -q --upgrade pip
          .venv-mac/bin/pip install -q customtkinter pillow textual rich pyinstaller
          # App de ventana (.bundle)
          .venv-mac/bin/pyinstaller --name NyxRecover --windowed \
            --osx-bundle-identifier com.d1se0.nyxrecover \
            --add-data "nyx:nyx" --collect-all customtkinter --collect-all textual --collect-all rich \
            --distpath dist nyx/launcher.py
          # CLI (consola)
          .venv-mac/bin/pyinstaller --name NyxRecover-cli --onefile --console \
            --add-data "nyx:nyx" --collect-all customtkinter --collect-all textual --collect-all rich \
            --distpath dist nyx/launcher.py
          zip -qry dist/NyxRecover-${{ github.ref_name }}-macos.zip dist/NyxRecover.app dist/NyxRecover-cli
      - uses: actions/upload-artifact@v4
        with:
          name: nyxrecover-macos
          path: dist/NyxRecover-*-macos.zip

  release:
    needs: [build-linux-deb, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/nyxrecover-deb/*.deb
            artifacts/nyxrecover-windows/*
            artifacts/nyxrecover-macos/*.zip
          generate_release_notes: true
